<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Trip Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="locked">
  <div id="lock" class="lock" hidden>
    <form id="lockForm" class="lock-card" autocomplete="on">
      <div id="lockArt" class="lock-art" aria-hidden="true"></div>
      <h1>Your trip guide</h1>
      <p class="muted">Enter the trip password to unlock.</p>
      <input id="lockPass" type="password" autocomplete="current-password" aria-label="Password" placeholder="Password" required>
      <label class="check-row"><input id="lockRemember" type="checkbox" checked> Remember on this device</label>
      <p id="lockError" class="lock-error" role="alert"></p>
      <button id="lockSubmit" type="submit" class="btn primary block">Unlock</button>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/today">
          <span class="brand-route" id="brandRoute"></span>
          <span class="brand-title" id="brandTitle"></span>
        </a>
        <div class="top-actions" id="topActions"></div>
      </div>
      <div id="editBar" class="edit-bar" hidden></div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  </div>

  <div id="sheetRoot" class="sheet-root" hidden>
    <div class="sheet-backdrop" data-act="close-sheet"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept=".js,.json,application/json,text/javascript" hidden>

  <script src="app.js"></script>
</body>
</html>
